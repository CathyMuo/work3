<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work 3 看板</title>
<style>
:root { --bg:#f4f5f7; --card:#fff; --ink:#18202c; --mute:#677184; --line:#e2e6ec; --soft:#f0f3f8;
        --ok:#178a4c; --okbg:#e3f4ea; --run:#2459d6; --runbg:#e6eefc; --bad:#c23a3a; --badbg:#fbe9e9;
        --warn:#a86b12; --warnbg:#fbf1e0; --pend:#a3abb8; --pendbg:#eef0f3; --acc:#6d4bd8; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151a; --card:#1b1f26; --ink:#e7eaef; --mute:#99a2b1; --line:#2b313b; --soft:#20252e;
        --ok:#4cc38a; --okbg:#173326; --run:#76a3ff; --runbg:#1b2a47; --bad:#ff8080; --badbg:#3a1d1f;
        --warn:#f0b75a; --warnbg:#3a2d17; --pend:#6c7584; --pendbg:#252a33; --acc:#a58cff; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--card); padding:12px 24px; border-bottom:1px solid var(--line); display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
header h1 { font-size:17px; margin:0; letter-spacing:.2px; }
nav { display:flex; gap:6px; flex-wrap:wrap; }
nav button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
nav button.on { background:var(--run); border-color:var(--run); color:#fff; }
#upd { margin-left:auto; }
main { padding:18px 24px 40px; max-width:1240px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
.card h2 { font-size:16px; margin:0 0 12px; }
.mute { color:var(--mute); } .small { font-size:12.5px; }
table { border-collapse:collapse; width:100%; margin:6px 0 10px; }
th, td { border-bottom:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top; }
th { color:var(--mute); font-weight:600; }
code { background:var(--soft); padding:1px 5px; border-radius:4px; }
pre { white-space:pre-wrap; word-break:break-all; font-size:12px; background:var(--soft); padding:9px; border-radius:8px; max-height:380px; overflow:auto; }
details { border-top:1px solid var(--line); padding:8px 0 2px; margin-top:10px; } summary { cursor:pointer; color:var(--mute); }
.done { color:var(--ok); } .running { color:var(--run); } .failed { color:var(--bad); } .stalled { color:var(--warn); } .pending { color:var(--pend); }
.ps { display:inline-block; padding:1px 9px; border-radius:999px; font-size:12px; font-weight:600; }
.ps.done { background:var(--okbg); } .ps.running { background:var(--runbg); } .ps.failed { background:var(--badbg); } .ps.stalled { background:var(--warnbg); } .ps.pending { background:var(--pendbg); color:var(--mute); }
.bar { height:10px; background:var(--pendbg); border-radius:6px; overflow:hidden; flex:1; }
.bar > i { display:block; height:100%; background:var(--run); border-radius:6px; transition:width .6s; }
.bar.big { height:16px; } .bar.thin { height:6px; }
/* roadmap */
.road { display:grid; grid-template-columns:repeat(5, 1fr); gap:0; position:relative; }
.ph { position:relative; padding:0 10px 4px; text-align:center; }
.ph::before { content:""; position:absolute; top:15px; left:-50%; width:100%; height:3px; background:var(--line); z-index:0; }
.ph:first-child::before { display:none; }
.ph.done::before, .ph.running::before { background:var(--ok); }
.ph .dot { position:relative; z-index:1; width:32px; height:32px; margin:0 auto 6px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; background:var(--pendbg); color:var(--mute); border:2px solid var(--line); }
.ph.done .dot { background:var(--ok); color:#fff; border-color:var(--ok); }
.ph.running .dot { background:var(--run); color:#fff; border-color:var(--run); }
.ph.failed .dot { background:var(--bad); color:#fff; border-color:var(--bad); }
.ph.stalled .dot { background:var(--warn); color:#fff; border-color:var(--warn); }
.pt { font-weight:650; } .pw { font-size:12.5px; color:var(--mute); margin-top:4px; }
.pr { font-size:13px; font-weight:650; margin-top:4px; } .pg { font-size:11.5px; color:var(--mute); margin-top:4px; border-top:1px dashed var(--line); padding-top:4px; }
/* run card */
.rh { display:flex; align-items:center; gap:12px; } .rh h2 { margin:0; }
.overall { margin:12px 0 14px; } .ov { display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; margin-top:6px; } .ov > b { font-size:22px; }
.now { border-radius:10px; padding:12px 14px; margin-bottom:14px; background:var(--soft); border-left:4px solid var(--pend); }
.now.running { background:var(--runbg); border-left-color:var(--run); } .now.stalled { background:var(--warnbg); border-left-color:var(--warn); }
.now.failed { background:var(--badbg); border-left-color:var(--bad); } .now.done { background:var(--okbg); border-left-color:var(--ok); }
.nt { font-size:15px; } .nx { color:var(--mute); margin:4px 0 8px; font-size:13px; }
.nb { display:flex; align-items:center; gap:10px; margin:6px 0; } .nb > span { width:84px; color:var(--mute); font-size:12.5px; } .nb > em { font-style:normal; font-size:12.5px; min-width:150px; }
.lanes { display:flex; flex-direction:column; gap:8px; }
.lane { display:grid; grid-template-columns:64px 1fr; align-items:center; gap:10px; }
.ll { font-weight:650; font-size:13px; color:var(--mute); text-align:right; }
.lbar { display:flex; gap:4px; }
.seg { position:relative; height:42px; border-radius:8px; background:var(--pendbg); overflow:hidden; min-width:0; border:1px solid transparent; }
.seg.running { border-color:var(--run); } .seg.stalled { border-color:var(--warn); } .seg.failed { border-color:var(--bad); background:var(--badbg); }
.segfill { position:absolute; inset:0 auto 0 0; background:var(--okbg); }
.seg.running .segfill, .seg.stalled .segfill { background:repeating-linear-gradient(45deg, var(--runbg), var(--runbg) 8px, rgba(36,89,214,.18) 8px, rgba(36,89,214,.18) 16px); }
.segl { position:relative; padding:0 8px; line-height:40px; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg.done .segl { color:var(--ok); } .seg.running .segl { color:var(--run); font-weight:600; } .seg.pending .segl { color:var(--mute); }
.em { margin-left:6px; color:var(--ink); } .em.good { color:var(--ok); }
.emrow { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.emc { flex:1; min-width:120px; background:var(--soft); border-radius:10px; padding:8px 12px; display:flex; flex-direction:column; }
.emc span { font-size:12px; color:var(--mute); } .emc b { font-size:20px; } .emc em { font-style:normal; font-size:11.5px; color:var(--mute); }
.emc.gate { background:var(--warnbg); }
.gpus { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; }
.gpu { background:var(--soft); border-radius:10px; padding:10px 12px; }
.gl { display:grid; grid-template-columns:42px 1fr 108px; align-items:center; gap:8px; font-size:12px; margin-top:5px; }
.gl span { color:var(--mute); } .gl em { font-style:normal; text-align:right; }
.meter { height:7px; background:var(--pendbg); border-radius:4px; overflow:hidden; } .meter i { display:block; height:100%; }
.meter.u i { background:var(--run); } .meter.p i { background:var(--warn); } .meter.m i { background:var(--acc); }
@media (max-width: 760px) { .road { grid-template-columns:1fr; gap:10px; } .ph { text-align:left; padding-left:44px; } .ph .dot { position:absolute; left:0; top:0; }
  .ph::before { display:none; } .lane { grid-template-columns:1fr; } .ll { text-align:left; } .seg { height:auto; } .segl { line-height:1.4; padding:6px 8px; white-space:normal; } .lbar { flex-direction:column; } }
/* curves */
.ctl { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
.ctl select, .ctl button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:4px 8px; border-radius:6px; }
.chips { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0; }
.chip { border:1px solid var(--line); border-radius:999px; padding:1px 9px; font-size:12px; cursor:pointer; background:var(--card); color:var(--ink); }
.chip.on { border-color:var(--run); color:var(--run); background:var(--runbg); }
.charts { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr)); gap:12px; }
.chart { position:relative; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px 6px; }
.chart h3 { font-size:13px; margin:0 0 2px; font-weight:600; word-break:break-all; }
.chart svg { width:100%; height:200px; display:block; }
.chart .legend { font-size:11.5px; color:var(--mute); display:flex; flex-wrap:wrap; gap:4px 12px; }
.chart .legend i { display:inline-block; width:10px; height:3px; margin-right:4px; vertical-align:middle; }
.tip { position:absolute; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 7px; font-size:11.5px; box-shadow:0 2px 8px rgba(0,0,0,.12); white-space:nowrap; z-index:2; }
.axis { fill:var(--mute); font-size:10px; } .gridl { stroke:var(--line); stroke-width:1; }
.lnk { text-decoration:underline dotted; }
/* briefing */
.brief { max-width:960px; margin:0 auto; }
.brief .hero { background:linear-gradient(135deg, var(--runbg), var(--card)); border:1px solid var(--line); border-radius:16px; padding:28px 30px; margin-bottom:18px; }
.brief .kicker { color:var(--run); font-weight:650; font-size:13px; letter-spacing:.5px; }
.brief .hero h1 { font-size:26px; line-height:1.35; margin:8px 0 12px; }
.brief .lead { font-size:15.5px; line-height:1.8; margin:0; }
.brief .tags { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; } .brief .tags span { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:12px; color:var(--mute); }
.brief .sec { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 26px; margin-bottom:16px; }
.brief h2 { font-size:19px; margin:0 0 12px; display:flex; align-items:center; gap:10px; }
.brief h2 i { font-style:normal; width:28px; height:28px; border-radius:50%; background:var(--run); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
.brief h3 { font-size:15px; margin:18px 0 8px; }
.brief p, .brief li { font-size:14.5px; line-height:1.85; }
.brief .cols { display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start; } .brief .cols.eq { grid-template-columns:1fr 1fr; }
.brief .callout { background:var(--warnbg); border-left:4px solid var(--warn); border-radius:8px; padding:12px 14px; font-size:14px; line-height:1.8; }
.brief .note { color:var(--mute); font-size:13px; }
.brief .formula { font-family:"Cambria Math","Times New Roman",serif; font-size:18px; text-align:center; background:var(--soft); border-radius:10px; padding:14px; margin:10px 0; }
.brief .formula.big { font-size:19px; }
.brief .formula .g { color:var(--ok); } .brief .formula .r { color:var(--bad); }
.brief .pill { border-radius:10px; padding:10px 12px; font-size:13.5px; } .brief .pill.g { background:var(--okbg); } .brief .pill.r { background:var(--badbg); }
.brief ul.ticks { padding-left:20px; }
.brief table.num td:not(:first-child), .brief table.num th:not(:first-child) { text-align:center; }
.brief td.good { color:var(--ok); font-weight:650; } .brief td.bad, .brief .bad { color:var(--bad); font-weight:650; } .brief .dim { color:var(--mute); font-weight:400; font-size:12px; }
.brief .ok { fill:var(--ok); font-weight:650; } .brief text.bad { fill:var(--bad); }
.brief .fig { margin:12px 0 4px; background:var(--soft); border-radius:12px; padding:12px; }
.brief .fig svg { width:100%; height:auto; display:block; color:var(--mute); }
.brief .fig figcaption { font-size:13px; color:var(--mute); margin-top:6px; line-height:1.7; }
.brief .node rect { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
.brief .node.acc rect { stroke:var(--run); fill:var(--runbg); } .brief .node.warn rect { stroke:var(--warn); fill:var(--warnbg); }
.brief .node.soft rect { fill:var(--card); stroke:var(--line); stroke-dasharray:4 3; }
.brief .node.swap rect { stroke:var(--acc); fill:var(--card); stroke-width:2; } .brief .node.dim2 rect { fill:var(--pendbg); }
.brief .node text { fill:var(--ink); font-size:14px; text-anchor:middle; } .brief .node text.sub { fill:var(--mute); font-size:11.5px; }
.brief .edge line, .brief .edge path { stroke:var(--mute); stroke-width:1.6; }
.brief text.cap { fill:var(--mute); font-size:12px; text-anchor:middle; } .brief text.lab { fill:var(--mute); font-size:12.5px; font-weight:600; }
.brief rect.bracket { fill:none; stroke:var(--acc); stroke-dasharray:5 4; }
.brief .stepper { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
.brief .st { background:var(--soft); border-radius:12px; padding:12px; border-top:4px solid var(--run); display:flex; flex-direction:column; gap:6px; }
.brief .st b { font-size:15px; } .brief .st span { font-size:13px; } .brief .st em { font-style:normal; font-size:12.5px; background:var(--warnbg); border-radius:6px; padding:4px 6px; }
.brief .st small { color:var(--mute); font-size:12px; line-height:1.6; }
.brief table.tl td:first-child { white-space:nowrap; color:var(--mute); width:120px; }
@media (max-width: 760px) { .brief .cols, .brief .cols.eq, .brief .stepper { grid-template-columns:1fr; } .brief .hero h1 { font-size:21px; } main { padding:14px; } }
</style>
</head>
<body>
<header>
  <h1>Work 3 · 零数据自博弈搜索智能体</h1>
  <nav><button id="t-live" class="on">实验进度</button> <button id="t-cur">训练曲线</button> <button id="t-brief">研究说明</button> <button id="t-res">项目记录</button></nav>
  <span class="mute" id="upd"></span>
</header>
<main>
  <section id="live"></section>
  <section id="cur" hidden>
    <div class="card">
      <div class="ctl">
        <label>运行 <select id="c-run"></select></label>
        <label>阶段 <select id="c-stage"></select></label>
        <label><input type="checkbox" id="c-cmp"> 叠加三轮对比</label>
        <label>平滑 <select id="c-smooth"><option value="0">无</option><option value="0.6">0.6</option><option value="0.8">0.8</option><option value="0.9">0.9</option></select></label>
        <button id="c-def">常用指标</button> <button id="c-val">验证 EM</button> <button id="c-time">耗时 / 吞吐</button> <button id="c-none">清空</button>
        <span class="mute" id="c-info"></span>
      </div>
      <div id="c-groups"></div>
    </div>
    <div class="charts" id="c-charts"></div>
    <div class="card" id="c-reward" hidden><h2>P2 出题奖励日志（每步一次）</h2><div class="charts" id="c-reward-charts"></div></div>
    <div class="card"><h2>GPU 与检索服务历史（看板启动后每 10 秒采样，保留 6 小时）</h2><div class="charts" id="c-hist"></div></div>
  </section>
  <section id="brief" hidden><article class="brief" id="brief-body">加载中…</article></section>
  <section id="res" hidden></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATE = {done:"✓ 完成", running:"⟳ 进行中", failed:"✗ 失败", stalled:"⚠ 长时间无输出", pending:"○ 待运行"};
const hms = s => { if (s == null) return "—"; s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h} 小时 ${m} 分` : `${m} 分 ${s%60} 秒`; };
const pct = x => x == null ? "—" : (x*100).toFixed(1) + "%";
let openLog = null;

const clock = t => { const d = new Date(t * 1000); return `${d.getMonth() + 1}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const ICON = {done: "✓", running: "⟳", failed: "✗", stalled: "⚠", pending: "○"};

function roadmapCard(rm) {
  if (!rm) return "";
  return `<div class="card"><h2>研究路线</h2><div class="road">` + rm.map((p, i) => `
    <div class="ph ${p.state}"><div class="dot">${ICON[p.state] || "○"}</div>
      <div class="pt">${esc(p.title)}</div><div class="ps ${p.state}">${esc(p.status)}</div>
      <div class="pw">${esc(p.what)}</div>
      ${p.result ? `<div class="pr">${esc(p.result)}</div>` : ""}
      <div class="pg" title="冻结门槛">${esc(p.gate)}</div></div>`).join("") + `</div></div>`;
}

function gpuStrip(g) {
  if (!g) return `<div class="card"><h2>GPU</h2><p class="mute">nvidia-smi 不可用</p></div>`;
  const meter = (v, max, cls) => `<div class="meter ${cls}"><i style="width:${Math.min(100, (v ?? 0) / (max || 1) * 100).toFixed(1)}%"></i></div>`;
  return `<div class="card"><h2>GPU <span class="mute">（每 8 秒刷新；历史曲线见“训练曲线”页）</span></h2><div class="gpus">` + g.map(x => `
    <div class="gpu"><b>GPU ${esc(x.index)}</b> <span class="mute">${esc(x.name)}</span>
      <div class="gl"><span>利用率</span>${meter(x.util, 100, "u")}<em>${x.util ?? "—"}%</em></div>
      <div class="gl"><span>功率</span>${meter(x.power, x.power_limit, "p")}<em>${x.power != null ? Math.round(x.power) : "—"} / ${x.power_limit != null ? Math.round(x.power_limit) : "—"} W</em></div>
      <div class="gl"><span>显存</span>${meter(x.mem_used, x.mem_total, "m")}<em>${x.mem_used != null ? (x.mem_used / 1024).toFixed(0) : "—"} / ${x.mem_total != null ? (x.mem_total / 1024).toFixed(0) : "—"} GB</em></div>
    </div>`).join("") + `</div>
    <p class="mute small">怎么看：反向传播时 450–560 W、利用率 90% 以上属正常；rollout 尾段只剩少数长轨迹在“生成→检索”间等待，功率 100–150 W、利用率接近 0 也属正常。如果 rollout 前段利用率也长期低于 30%，请反馈。</p></div>`;
}

function lanesHtml(r) {
  return `<div class="lanes">` + r.lanes.map(l => {
    const total = l.segments.reduce((a, s) => a + Math.max(s.est_seconds, 1), 0);
    return `<div class="lane"><div class="ll">${esc(l.label)}</div><div class="lbar">` + l.segments.map(s => {
      const w = Math.max(14, s.est_seconds / total * 100);
      const fill = s.state === "done" ? 100 : (s.state === "pending" ? 0 : Math.max(3, s.fraction * 100));
      const em = s.em != null ? `<b class="em ${s.em >= r.threshold ? "good" : ""}">EM ${s.em.toFixed(3)}</b>` : "";
      const tip = `${s.label}：${({done: "已完成", running: "进行中", stalled: "长时间无输出", failed: "失败", pending: "待运行"})[s.state]}` +
        (s.seconds ? `，用时 ${hms(s.seconds)}` : `，预计 ${hms(s.est_seconds)}`);
      return `<div class="seg ${s.state}" style="flex:${w}" title="${esc(tip)}"><div class="segfill" style="width:${fill.toFixed(1)}%"></div>
        <div class="segl">${ICON[s.state]} ${esc(s.label)}${s.state === "running" ? " " + Math.round(s.fraction * 100) + "%" : ""} ${em}</div></div>`;
    }).join("") + `</div></div>`;
  }).join("") + `</div>`;
}

function nowBox(r) {
  const c = r.current;
  if (!c) {
    if (r.stages.every(s => s.state === "done")) return `<div class="now done"><b>全部完成。</b></div>`;
    return `<div class="now idle">当前没有正在运行的步骤${r.started ? "（可能在两个命令之间，或已手动停止）" : "，尚未开始"}。</div>`;
  }
  let h = `<div class="now ${c.state}"><div class="nt">${ICON[c.state]} 正在进行：<b>${esc(c.label)}</b>` +
    (c.state === "stalled" ? ` <span class="ps stalled">日志 ${hms(c.idle_seconds)} 没有更新，请检查</span>` :
     c.idle_seconds != null ? ` <span class="mute">日志 ${hms(c.idle_seconds)} 前更新</span>` : "") + `</div>`;
  if (c.explain) h += `<div class="nx">${esc(c.explain)}</div>`;
  if (c.fraction != null) h += `<div class="nb"><span>本步骤进度</span><div class="bar"><i style="width:${(c.fraction * 100).toFixed(1)}%"></i></div><em>${Math.round(c.fraction * 100)}%${c.steps_total ? `（训练第 ${c.steps_done} / ${c.steps_total} 步）` : "（按耗时估计）"}</em></div>`;
  const ro = Object.entries(c.bars || {}).find(([k]) => /Rollout/.test(k));
  if (ro) h += `<div class="nb"><span>本步内采样</span><div class="bar thin"><i style="width:${ro[1].pct}%"></i></div><em>${ro[1].n} / ${ro[1].total}　${esc(ro[1].info)}</em></div>`;
  const ls = c.last_step;
  if (ls && ls["critic/score/mean"] != null) h += `<div class="mute small">最近一步：平均得分 ${fmt(ls["critic/score/mean"])}${ls["timing_s/step"] != null ? `，每步 ${hms(ls["timing_s/step"])}` : ""}${ls["response_length/mean"] != null ? `，平均回答长度 ${Math.round(ls["response_length/mean"])} token` : ""}</div>`;
  return h + `</div>`;
}

function runCard(r) {
  if (!r.exists) return "";
  const pctAll = Math.round(r.overall_fraction * 100);
  let h = `<div class="card run"><div class="rh"><h2>${esc(r.title)}</h2>`;
  if (r.summary) { const v = r.summary.verdict; h += `<span class="ps ${v === "PASS" || v === "GO" ? "done" : v === "INVALID" ? "stalled" : "failed"}">判定：${esc(v)}</span>`; }
  h += `</div><div class="overall"><div class="bar big"><i style="width:${pctAll}%"></i></div><div class="ov"><b>${pctAll}%</b>` +
       (r.started && r.eta_seconds > 0 ? `<span>还需约 <b>${hms(r.eta_seconds)}</b>，预计 <b>${clock(r.finish_at)}</b> 完成</span>` : r.started ? `<span>已完成</span>` : `<span>尚未开始</span>`) +
       `<span class="mute small">按已完成步骤的实测耗时估计</span></div></div>`;
  h += nowBox(r) + lanesHtml(r);
  if (r.kind === "p0" && r.evals && Object.keys(r.evals).length) {
    h += `<div class="emrow">` + Object.entries(r.evals).map(([t, e]) => `<div class="emc"><span>${t === "0" ? "基座模型" : "第 " + t + " 轮"}</span><b>${e && e.average != null ? e.average.toFixed(3) : "—"}</b><em>论文 ${({"0": "—", "1": "0.304", "2": "0.319", "3": "0.326"})[t]}</em></div>`).join("") +
         `<div class="emc gate"><span>P0 门槛（第 3 轮）</span><b>≥ ${r.threshold}</b><em>论文 0.326 − 2 pp</em></div></div>`;
  }
  const e = r.errors, uf = Object.entries(e.undefined_function_names || {}).map(([k, v]) => `${esc(k)}×${v}`).join("，");
  const warn = e.traceback + e.failed + e.oom;
  h += `<details><summary>详情：全部子步骤、检索服务、告警（${warn ? `<span class="failed">${warn} 条</span>` : "无"}）、最新日志</summary>`;
  h += `<table class="small"><tr><th>子步骤</th><th>状态</th><th>用时 / 预计</th></tr>` + r.stages.map(s => `<tr><td>${esc(s.label)} <span class="mute">${esc(s.name)}</span></td><td class="${s.state}">${ICON[s.state]} ${({done: "完成", running: "进行中", stalled: "无输出", failed: "失败", pending: "待运行"})[s.state]}</td><td>${s.seconds ? hms(s.seconds) : "预计 " + hms(s.est_seconds)}</td></tr>`).join("") + `</table>`;
  if (r.retriever) { const q = r.retriever; h += `<p class="small">检索服务（近 ${q.window_seconds}s）：${q.requests_per_second} 次/秒，p50 ${q.p50_ms ?? "—"} ms，p95 ${q.p95_ms ?? "—"} ms，进行中 ${q.in_flight}，错误 ${q.errors_in_window}</p>`; }
  const pc = Object.entries(r.pool_checks || {}); if (pc.length) h += `<p class="small">题池检查：` + pc.map(([k, ok]) => `${esc(k)} ${ok ? "✓" : "✗"}`).join("，") + `</p>`;
  h += `<p class="small">告警：Traceback ${e.traceback}，FAILED ${e.failed}，显存不足 ${e.oom}，工具名写错 ${e.undefined_function}${uf ? "（" + uf + "）" : ""}</p>`;
  if (e.last_lines && e.last_lines.length) h += `<pre>${esc(e.last_lines.join("\n"))}</pre>`;
  h += `<details ${openLog === r.id ? "open" : ""} data-log="${esc(r.id)}"><summary>最新日志（最后 80 行）</summary><pre id="log-${esc(r.id)}">点开后加载…</pre></details>`;
  return h + `</details></div>`;
}

// ------------------------------------------------------------------ training curves
const PALETTE = ["#2563eb", "#d97706", "#16a34a", "#dc2626", "#7c3aed", "#0891b2", "#db2777", "#65a30d"];
const DEFAULT_KEYS = ["critic/score/mean", "critic/rewards/mean", "response_length/mean", "actor/entropy", "actor/pg_loss",
  "actor/grad_norm", "actor/pg_clipfrac", "actor/ppo_kl", "num_turns/mean", "timing_s/step"];
const CHARTS = {};
let cur = {run: null, stage: null, data: null, keys: new Set(), loaded: false};
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

function niceTicks(lo, hi, n = 4) {
  if (!(isFinite(lo) && isFinite(hi))) return [];
  if (lo === hi) { lo -= Math.abs(lo) * 0.1 || 1; hi += Math.abs(hi) * 0.1 || 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => raw <= s);
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toPrecision(12));
  return out;
}
const fmt = v => v == null ? "—" : v === 0 ? "0" : (Math.abs(v) >= 1000 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(2) : Math.abs(v) >= 0.01 ? v.toFixed(4) : v.toExponential(2));
function ema(ys, a) { if (!a) return ys; let p = null; return ys.map(y => y == null ? null : (p = p == null ? y : a * p + (1 - a) * y)); }

function lineChart(id, title, series, opt = {}) {
  // series: [{name, xs, ys}]; returns HTML; data kept in CHARTS[id] for hover
  const W = 640, H = 200, L = 52, R = 10, T = 8, B = 24;
  const all = series.flatMap(s => s.xs.map((x, i) => [x, s.ys[i]])).filter(p => p[1] != null && isFinite(p[1]));
  if (all.length < 1) return `<div class="chart"><h3>${esc(title)}</h3><p class="mute">暂无数据</p></div>`;
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 1; x1 += 1; }
  const yt = niceTicks(Math.min(...ys), Math.max(...ys)); const y0 = Math.min(yt[0], ...ys), y1 = Math.max(yt[yt.length - 1], ...ys);
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (1 - (y - y0) / ((y1 - y0) || 1)) * (H - T - B);
  const xt = niceTicks(x0, x1, 5);
  let g = yt.map(v => `<line class="gridl" x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}"/><text class="axis" x="${L - 4}" y="${sy(v) + 3}" text-anchor="end">${esc(fmt(v))}</text>`).join("");
  g += xt.map(v => `<text class="axis" x="${sx(v)}" y="${H - 6}" text-anchor="middle">${esc(opt.xfmt ? opt.xfmt(v) : v)}</text>`).join("");
  const lines = series.map((s, k) => {
    let d = "", pen = false;
    s.xs.forEach((x, i) => { const y = s.ys[i]; if (y == null || !isFinite(y)) { pen = false; return; }
      d += (pen ? "L" : "M") + sx(x).toFixed(1) + "," + sy(y).toFixed(1); pen = true; });
    const dots = s.xs.length <= 60 ? s.xs.map((x, i) => s.ys[i] == null ? "" : `<circle cx="${sx(x).toFixed(1)}" cy="${sy(s.ys[i]).toFixed(1)}" r="2" fill="${PALETTE[k % 8]}"/>`).join("") : "";
    return `<path d="${d}" fill="none" stroke="${PALETTE[k % 8]}" stroke-width="1.8"/>` + dots;
  }).join("");
  const ref = opt.ref != null && opt.ref >= y0 && opt.ref <= y1 ? `<line x1="${L}" x2="${W - R}" y1="${sy(opt.ref)}" y2="${sy(opt.ref)}" stroke="var(--bad)" stroke-dasharray="4 3"/>` : "";
  CHARTS[id] = {series, sx, x0, x1, L, R, W, xfmt: opt.xfmt, xlabel: opt.xlabel || "步"};
  const legend = series.length > 1 || opt.legend ? `<div class="legend">` + series.map((s, k) => `<span><i style="background:${PALETTE[k % 8]}"></i>${esc(s.name)}</span>`).join("") + `</div>` : "";
  const last = series.map(s => { for (let i = s.ys.length - 1; i >= 0; i--) if (s.ys[i] != null) return s.ys[i]; return null; });
  return `<div class="chart" data-chart="${id}"><h3>${esc(title)} <span class="mute">最新 ${last.map(fmt).join(" / ")}</span></h3>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}${ref}${lines}<line class="hover" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--mute)" stroke-dasharray="2 2" visibility="hidden"/></svg>${legend}</div>`;
}

document.addEventListener("mousemove", ev => {
  const box = ev.target.closest && ev.target.closest(".chart[data-chart]");
  document.querySelectorAll(".tip").forEach(t => { if (!box || t.parentNode !== box) t.remove(); });
  document.querySelectorAll(".chart svg .hover").forEach(l => { if (!box || !box.contains(l)) l.setAttribute("visibility", "hidden"); });
  if (!box) return;
  const c = CHARTS[box.dataset.chart]; if (!c) return;
  const svg = box.querySelector("svg"), r = svg.getBoundingClientRect();
  const px = (ev.clientX - r.left) / r.width * c.W; if (px < c.L || px > c.W - c.R) return;
  const xv = c.x0 + (px - c.L) / (c.W - c.L - c.R) * (c.x1 - c.x0);
  let best = null;
  c.series.forEach(s => s.xs.forEach(x => { if (best == null || Math.abs(x - xv) < Math.abs(best - xv)) best = x; }));
  const rows = c.series.map((s, k) => { const i = s.xs.indexOf(best); return i < 0 || s.ys[i] == null ? "" : `<div><span style="color:${PALETTE[k % 8]}">■</span> ${esc(s.name)}：${fmt(s.ys[i])}</div>`; }).join("");
  const line = svg.querySelector(".hover"); line.setAttribute("x1", c.sx(best)); line.setAttribute("x2", c.sx(best)); line.setAttribute("visibility", "visible");
  let tip = box.querySelector(".tip"); if (!tip) { tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip); }
  tip.innerHTML = `<b>${esc(c.xlabel)} ${esc(c.xfmt ? c.xfmt(best) : best)}</b>${rows}`;
  const bx = box.getBoundingClientRect(); let left = ev.clientX - bx.left + 12; if (left > bx.width - 200) left = ev.clientX - bx.left - 200;
  tip.style.left = left + "px"; tip.style.top = (ev.clientY - bx.top + 10) + "px";
});

async function curInit() {
  const s = await (await fetch("/api/state")).json();
  const runs = s.runs.filter(r => r.exists);
  $("#c-run").innerHTML = runs.map(r => `<option value="${esc(r.id)}">${esc(r.title)}</option>`).join("") || `<option value="">（没有运行目录）</option>`;
  if (cur.run && runs.some(r => r.id === cur.run)) $("#c-run").value = cur.run;
  cur.run = $("#c-run").value; cur.loaded = true;
  await curStages();
}

async function curStages() {
  if (!cur.run) return;
  const st = await (await fetch("/api/stages?run=" + encodeURIComponent(cur.run))).json();
  const opts = st.stages.map(x => `<option value="${esc(x.name)}">${esc(x.label)}</option>`).join("");
  $("#c-stage").innerHTML = opts || `<option value="">（还没有训练日志）</option>`;
  const running = [...st.stages].reverse().find(x => /challenger|solver/.test(x.name));
  if (cur.stage && st.stages.some(x => x.name === cur.stage)) $("#c-stage").value = cur.stage;
  else if (running) $("#c-stage").value = running.name;
  cur.stage = $("#c-stage").value;
  $("#c-reward").hidden = !st.reward_log;
  await curLoad();
}

function stageType(stage) { return (stage || "").replace(/^iter\d_/, "").replace(/\d$/, ""); }

async function curLoad() {
  if (!cur.run || !cur.stage) { $("#c-charts").innerHTML = ""; return; }
  const cmp = $("#c-cmp").checked ? 1 : 0;
  const d = await (await fetch(`/api/metrics?run=${encodeURIComponent(cur.run)}&stage=${encodeURIComponent(cur.stage)}&compare=${cmp}`)).json();
  cur.data = d;
  const keys = new Set(); Object.values(d.series).forEach(s => s.keys.forEach(k => keys.add(k)));
  const saved = store.get("w3keys:" + stageType(cur.stage), null);
  cur.keys = new Set((saved || DEFAULT_KEYS.concat([...keys].filter(k => /^val-core\/.*mean@1$/.test(k)))).filter(k => keys.has(k)));
  renderGroups([...keys].sort());
  renderCharts();
  if (!$("#c-reward").hidden) loadRewardLog();
}

function renderGroups(keys) {
  const groups = {};
  keys.forEach(k => { const g = k.includes("/") ? k.split("/")[0] : "其他"; (groups[g] = groups[g] || []).push(k); });
  $("#c-groups").innerHTML = Object.entries(groups).map(([g, ks]) => `<details ${ks.some(k => cur.keys.has(k)) ? "open" : ""}><summary>${esc(g)}（${ks.length}）</summary><div class="chips">` +
    ks.map(k => `<span class="chip ${cur.keys.has(k) ? "on" : ""}" data-key="${esc(k)}">${esc(k.slice(g.length + 1) || k)}</span>`).join("") + `</div></details>`).join("")
    || `<p class="mute">这个日志里还没有 step 指标（verl 每步结束才打印一行）。</p>`;
  $("#c-groups").querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
    const k = ch.dataset.key; cur.keys.has(k) ? cur.keys.delete(k) : cur.keys.add(k);
    ch.classList.toggle("on"); store.set("w3keys:" + stageType(cur.stage), [...cur.keys]); renderCharts();
  });
}

function renderCharts() {
  const d = cur.data; if (!d) return;
  const a = +$("#c-smooth").value, names = Object.keys(d.series);
  const label = n => d.compare ? n.replace(/_.*/, "").replace("iter", "第") + "轮" : "";
  let html = "";
  const rw = names.filter(n => d.series[n].rewards.length);
  if (rw.length) html += lineChart("rw", "出题者奖励（每步 Final rewards Avg）", rw.map(n => ({name: label(n) || "奖励", xs: d.series[n].rewards.map((_, i) => i + 1), ys: ema(d.series[n].rewards, a)})));
  for (const k of [...cur.keys]) {
    const ser = names.map(n => { const s = d.series[n], rows = s.rows.filter(r => r[k] != null);
      return {name: label(n) || k, xs: rows.map(r => r.step - (d.compare ? s.step_offset : 0)), ys: ema(rows.map(r => r[k]), a)}; }).filter(s => s.xs.length);
    html += lineChart("m-" + k, k, ser, {legend: d.compare});
  }
  const n = names.reduce((m, x) => Math.max(m, d.series[x].rows.length), 0);
  $("#c-info").textContent = `${n} 个 step、${cur.keys.size} 项指标已选${d.compare ? "；横轴为本轮内步数" : ""}`;
  $("#c-charts").innerHTML = html || `<div class="card mute">请在上方选择指标。</div>`;
}

async function loadRewardLog() {
  const d = await (await fetch("/api/rewardlog?run=" + encodeURIComponent(cur.run))).json();
  const rows = d.rows || [], a = +$("#c-smooth").value, xs = rows.map(r => r.call);
  const one = (key, title) => lineChart("rl-" + key, title, [{name: key, xs, ys: ema(rows.map(r => r[key] ?? null), a)}]);
  const kk = Object.keys(rows[rows.length - 1] || {}).filter(k => /^k=\d+ share$/.test(k));
  $("#c-reward-charts").innerHTML = one("mean_difficulty", "平均难度分") + one("mean_final", "平均最终奖励") +
    one("mean_w_mixed", "NCP 信号占比 w（0<k<n 的题）") + one("eta_mixed", "噪声占比 η（0<k<n 的题）") +
    lineChart("rl-k", "解题成功次数 k 的分布", kk.map(k => ({name: k.replace(" share", ""), xs, ys: rows.map(r => r[k] ?? null)})), {legend: true}) +
    one("completion_tokens", "每步生成 token（出题奖励）") + one("seconds", "每步出题奖励耗时（秒）");
}

async function loadHistory() {
  const h = await (await fetch("/api/history")).json();
  const now = Date.now() / 1000, xm = t => (t - now) / 60, xfmt = v => (v >= -0.5 ? "现在" : Math.round(v) + " 分");
  const g = h.gpu || [], n = g.length ? g[g.length - 1].gpus.length : 0;
  const per = (field, f = v => v) => [...Array(n).keys()].map(i => ({name: "GPU " + i, xs: g.map(s => xm(s.t)), ys: g.map(s => s.gpus[i] ? f(s.gpus[i][field]) : null)}));
  let html = lineChart("h-power", "功率（W）", per("power"), {xfmt, xlabel: "时间", legend: true}) +
             lineChart("h-util", "GPU 利用率（%）", per("util"), {xfmt, xlabel: "时间", legend: true}) +
             lineChart("h-mem", "显存（GB）", per("mem", v => v == null ? null : v / 1024), {xfmt, xlabel: "时间", legend: true});
  for (const [run, rs] of Object.entries(h.retriever || {})) {
    html += lineChart("h-ret-" + run, `检索延迟（ms）· ${run}`, [{name: "p50", xs: rs.map(r => xm(r.t)), ys: rs.map(r => r.p50)}, {name: "p95", xs: rs.map(r => xm(r.t)), ys: rs.map(r => r.p95)}], {xfmt, xlabel: "时间", legend: true}) +
            lineChart("h-rps-" + run, `检索请求（次/秒）与进行中请求数 · ${run}`, [{name: "次/秒", xs: rs.map(r => xm(r.t)), ys: rs.map(r => r.rps)}, {name: "进行中", xs: rs.map(r => xm(r.t)), ys: rs.map(r => r.in_flight)}], {xfmt, xlabel: "时间", legend: true});
  }
  $("#c-hist").innerHTML = html;
}

function setKeys(pred) {
  const keys = new Set(); Object.values((cur.data || {}).series || {}).forEach(s => s.keys.forEach(k => keys.add(k)));
  cur.keys = new Set([...keys].filter(pred)); store.set("w3keys:" + stageType(cur.stage), [...cur.keys]);
  renderGroups([...keys].sort()); renderCharts();
}

$("#c-val").onclick = () => setKeys(k => /^val-(core|aux)\/.*(reward|acc)\/mean@1$/.test(k));
$("#c-time").onclick = () => setKeys(k => /^(timing_s|perf)\//.test(k));
$("#c-none").onclick = () => setKeys(() => false);

function show(which) {
  for (const w of ["live", "cur", "brief", "res"]) { $("#" + w).hidden = w !== which; $("#t-" + w).classList.toggle("on", w === which); }
  if (which === "res") loadResearch();
  if (which === "brief") loadBriefing();
  if (which === "cur") { (cur.loaded ? curLoad() : curInit()); loadHistory(); }
  try { history.replaceState(null, "", "#" + which); } catch (e) {}
}
for (const w of ["live", "cur", "brief", "res"]) $("#t-" + w).onclick = () => show(w);
tick(); setInterval(tick, 8000);
if (["cur", "brief", "res"].includes(location.hash.slice(1))) show(location.hash.slice(1));
setInterval(() => { if (!$("#cur").hidden) { curLoad(); loadHistory(); } }, 15000);
</script>
</body>
</html>
